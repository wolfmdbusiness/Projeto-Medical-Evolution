[project]
name = "medical-evolution-milestone1"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m \"not live\""
markers = [
  "live: requires live network access to the DeepSeek API (deselected by default; run with `pytest -m live`).",
]
